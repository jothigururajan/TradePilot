name: TradePilot NSE - Daily EOD Sync & 1-Month Paper Trial

on:
  schedule:
    # 10:45 UTC = 16:15 IST (Monday to Friday after NSE market close)
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force full OHLCV re-download"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  eod-screener-and-trial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD Market Sync, Screener, Paper Trial & Telegram Alert
        env:
          TRADEPILOT_TELEGRAM_BOT_TOKEN: ${{ secrets.TRADEPILOT_TELEGRAM_BOT_TOKEN }}
          TRADEPILOT_TELEGRAM_CHAT_ID: ${{ secrets.TRADEPILOT_TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            python eod_auto_update.py --force
          else
            python eod_auto_update.py
          fi

      - name: Save Updated SQLite Database & Exports Back to Repo
        run: |
          git config user.name "TradePilot Bot"
          git config user.email "tradepilot-bot@users.noreply.github.com"
          git add data_store/tradepilot_nse.db exports/
          if git diff --staged --quiet; then
            echo "No database or export changes to commit."
          else
            git commit -m "Auto EOD Sync & Paper Trial Update [skip ci]"
            git push
          fi
